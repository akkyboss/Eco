body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:#f5f7f6;
}

/* HERO */
header{
    background:linear-gradient(135deg,#1e7f5c,#2fa56f);
    color:#fff;
    text-align:center;
    padding:60px 20px;
}
header h1{
    margin:10px 0;
    font-size:32px;
}
header p{
    font-size:16px;
}
.btn{
    display:inline-block;
    margin:10px;
    padding:12px 25px;
    background:#fff;
    color:#1e7f5c;
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
}

/* SERVICES */
.services{
    padding:30px 15px;
}
.card{
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}
.img-box{
    position:relative;
}
.overlay-text{
    position:absolute;
    bottom:15px;
    left:15px;
    color:#fff;
    font-size:22px;
    font-weight:600;
    text-shadow:0 3px 10px rgba(0,0,0,0.6);
}
.card-title{
    padding:15px;
    font-size:16px;
}

/* BOOK BUTTON */
.book-btn{
    display:block;
    margin:30px auto;
    padding:15px 40px;
    background:#1e9ec9;
    color:#fff;
    border-radius:30px;
    text-align:center;
    width:200px;
    text-decoration:none;
    font-size:18px;
    box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* FOOTER */
footer{
    background:#1e9ec9;
    color:#fff;
    text-align:center;
    padding:40px 20px;
    font-size:18px;
}
